<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدفع</title>
</head>
<body style="font-family: sans-serif; max-width: 700px; margin: 2rem auto;">
    <h2>{{ order.description }}</h2>
    <p>المبلغ: {{ order.amount_cents|floatformat:0 }} قرش</p>

    {% if error %}
        <p style="color: red;">حصلت مشكلة في الاتصال بخدمة الدفع، حاول مرة تانية بعد شوية.</p>
    {% else %}
        <iframe src="{{ iframe_url }}" width="100%" height="700" style="border: 0;"></iframe>
    {% endif %}
</body>
</html>
